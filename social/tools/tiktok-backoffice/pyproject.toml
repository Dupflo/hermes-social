[project]
name = "tiktok-backoffice"
version = "0.1.0"
description = "Draft-only TikTok comment backoffice helpers for Hermes Social"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[project.scripts]
tiktok-backoffice = "app.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
