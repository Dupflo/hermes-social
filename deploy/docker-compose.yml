# Hermes Social — full stack: agent + Camofox browser.
#
# Fresh VPS: see ../README.md or just run ./bootstrap.sh
#
# Networking: hermes reaches camofox by service name over the compose
# network — nothing browser-related is published on the public interface.
# noVNC (6080) and VNC (5901) are bound to 127.0.0.1 only; use an SSH
# tunnel:  ssh -L 6080:127.0.0.1:6080 root@<vps>  →  http://localhost:6080
#
# meta-webhook serves two apps (app/serve.py): the public webhook on 8791
# (published on 127.0.0.1, fronted by the reverse proxy) and the internal
# /internal/* API on 8792, never published. 8792 is reached by the console
# (hermes-console-web) over the `console` network below, an internal network
# joined by meta-webhook only (console repo: ADR 012 and ADR 030). Its Bearer
# token lives in the Meta .env mounted on /app/.env, never in this
# directory's .env (read by the hermes container too).

name: hermes-social

services:
  hermes:
    image: hermes-social:latest
    restart: unless-stopped
    # Headless: the image's default main program is the interactive TUI, which
    # exits when stdin isn't a terminal. Gateway, cron and dashboard run as s6
    # services regardless — keep PID-1's main program alive with a sleep.
    command: ["sleep", "infinity"]
    ports:
      - "127.0.0.1:4860:9119"        # dashboard — front it with a reverse proxy for TLS
    env_file:
      - .env
    environment:
      CAMOFOX_URL: http://camofox:9377
      # Dashboard (kanban, sessions…) is opt-in in the upstream image and
      # requires an auth provider when bound beyond loopback.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${ADMIN_USERNAME:-hermes}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in deploy/.env}
    volumes:
      - ./data:/opt/data
      # Root-equivalent access to the host's Docker — deliberate choice so the
      # agent can manage containers itself. Remove if a given VPS shouldn't
      # grant that.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - camofox

  # Meta comment→DM automation (social/tools/meta-webhook) — FastAPI webhook
  # receiver. Meta calls it via your reverse proxy → 127.0.0.1:8791.
  meta-webhook:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - ../social/tools/meta-webhook:/app
      - ./meta-webhook-data:/app/data
      - /app/.venv            # keep the venv out of the repo checkout
    command: ["uv", "run", "python", "-m", "app.serve"]
    networks:
      - default               # Graph API, hermes
      - console               # reached by hermes-console-web (internal port 8792)

  camofox:
    # Built from https://github.com/jo-inc/camofox-browser → `make camofox`.
    # Adjust the tag to your arch (x86_64 / aarch64).
    image: camofox-browser:135.0.1-x86_64
    restart: unless-stopped
    ports:
      - "127.0.0.1:6080:6080"        # noVNC — local only, SSH tunnel to reach
      - "127.0.0.1:5901:5900"        # raw VNC — local only
    environment:
      CAMOFOX_PORT: "9377"
      # s20 (hermes-console ADR 049): protects storage_state (read by the console session check).
      # Same key as the hermes service, which gets it from deploy/.env through env_file. A restart does
      # not re-read the environment: recreate both with `docker compose up -d camofox hermes`.
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:-}
      ENABLE_VNC: "1"
      VNC_BIND: 0.0.0.0
      VNC_RESOLUTION: 1920x1080
      MAX_OLD_SPACE_SIZE: "2048"
    volumes:
      - ./camofox-data:/root/.camofox
      - ./camofox.config.json:/app/camofox.config.json:ro

networks:
  # Created by this project (deploy hermes-social before the console), joined
  # as `external` by the console's web service only. internal: no route out.
  console:
    name: hermes-social-console
    internal: true
